<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Separador de Nóminas | RH</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="barra-marca"></div>

    <div class="app-shell">
        <header class="panel-carga" id="panelCarga">
            <div class="panel-carga-inner">
                <div class="panel-carga-top">
                    <div class="panel-titulo">
                        <h1>Separar Nóminas</h1>
                        <p class="subtitulo">Separar por PDF por supervisor</p>
                    </div>

                    <div class="carga-controles">
                        <div class="grupo-archivo">
                            <span class="etiqueta-archivo">1. Archivo CSV</span>
                            <label class="file-trigger" id="labelCsv">
                                <svg class="file-icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path>
                                    <polyline points="14 2 14 8 20 8"></polyline>
                                    <path d="M8 13h2"></path>
                                    <path d="M8 17h2"></path>
                                    <path d="M14 13h2"></path>
                                    <path d="M14 17h2"></path>
                                </svg>
                                <span class="file-nombre" id="csvNombre">Seleccionar CSV</span>
                                <input type="file" id="csvInput" accept=".csv">
                            </label>
                        </div>

                        <div class="grupo-archivo">
                            <span class="etiqueta-archivo">2. PDF de Recibos</span>
                            <label class="file-trigger" id="labelPdf">
                                <svg class="file-icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path>
                                    <polyline points="14 2 14 8 20 8"></polyline>
                                    <line x1="16" y1="13" x2="8" y2="13"></line>
                                    <line x1="16" y1="17" x2="8" y2="17"></line>
                                </svg>
                                <span class="file-nombre" id="pdfNombre">Seleccionar PDF</span>
                                <input type="file" id="pdfInput" accept=".pdf">
                            </label>
                        </div>

                        <div class="carga-acciones">
                            <button type="button" id="btnProcesar" class="btn-primario">Separar Recibos</button>
                            <button type="button" id="btnDescargarZip" class="btn-outline oculto">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                    <polyline points="7 10 12 15 17 10"></polyline>
                                    <line x1="12" y1="15" x2="12" y2="3"></line>
                                </svg>
                                ZIP
                            </button>
                        </div>
                    </div>
                </div>

                <div id="estado"></div>
            </div>
        </header>

        <main id="dashboard" class="dashboard oculto">
            <section class="kpi-grid">
                <div class="kpi-card kpi-click" id="cardKpiTotal">
                    <div class="kpi-top">
                        <span class="kpi-etiqueta">Total Recibos</span>
                        <span class="kpi-dot"></span>
                    </div>
                    <span class="kpi-valor" id="kpiTotal">0</span>
                </div>
                <div class="kpi-card">
                    <div class="kpi-top">
                        <span class="kpi-etiqueta">Supervisores</span>
                        <span class="kpi-dot kpi-dot-gris"></span>
                    </div>
                    <span class="kpi-valor" id="kpiSupervisores">0</span>
                </div>
                <div class="kpi-card kpi-click" id="cardKpiSinAsignar">
                    <div class="kpi-top">
                        <span class="kpi-etiqueta">Sin Asignar</span>
                        <span class="kpi-dot kpi-dot-gris"></span>
                    </div>
                    <span class="kpi-valor" id="kpiSinAsignar">0</span>
                </div>
                <div class="kpi-card kpi-click" id="cardKpiSinRecibo">
                    <div class="kpi-top">
                        <span class="kpi-etiqueta">En CSV sin Recibo</span>
                        <span class="kpi-dot kpi-dot-gris"></span>
                    </div>
                    <span class="kpi-valor" id="kpiSinRecibo">0</span>
                </div>
            </section>

            <section class="workspace-grid">
                <div class="columna-izquierda">
                    <div class="panel-seccion">
                        <div class="seccion-header">
                            <h2>Impresión por Supervisor</h2>
                            <span class="contador-badge" id="contadorImpresos">0 / 0 impresos</span>
                        </div>
                        <div class="lista-supervisores" id="listaSupervisores"></div>
                    </div>

                    <div class="panel-seccion">
                        <div class="seccion-header">
                            <h2>Dashboard Operativo</h2>
                            <span class="contador-badge" id="contadorGrupos">0 supervisores</span>
                        </div>
                        <div class="contenedor-grafica" id="contenedorGrafica">
                            <canvas id="graficaBarras"></canvas>
                        </div>
                    </div>
                </div>

                <div class="panel-seccion panel-tabla">
                    <div class="seccion-header">
                        <h2>Lista de Empleados</h2>
                        <span class="contador-badge" id="contadorTabla">0 registros</span>
                    </div>

                    <div class="buscador-wrap">
                        <svg class="buscador-icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" id="buscador" placeholder="Buscar por ID, Nombre o Supervisor...">
                    </div>

                    <div id="barraFiltroActivo" class="barra-filtro oculto">
                        <span id="textoFiltroActivo"></span>
                        <button type="button" id="btnLimpiarFiltro" class="btn-limpiar">Quitar filtro</button>
                    </div>

                    <div id="listaEmpleados"></div>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>

</html>
